name: ${COMPOSE_PROJECT_NAME:-lift-lab}
services:
  frontend:
    container_name: ${COMPOSE_PROJECT_NAME:-lift-lab}-frontend
    build: ./frontend
    ports: ["${FRONTEND_PORT:-18200}:80"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 10
  backend:
    container_name: ${COMPOSE_PROJECT_NAME:-lift-lab}-backend
    build: ./backend
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://lift:lift@db/lift
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-local-demo-lift-lab-change-this-key}
      SEED_DEMO: ${SEED_DEMO:-true}
    ports: ["${BACKEND_PORT:-19200}:8000"]
    volumes: ["artifacts:/artifacts"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s
  worker:
    container_name: ${COMPOSE_PROJECT_NAME:-lift-lab}-worker
    build: ./backend
    command: ["python", "-m", "src.worker"]
    environment: *backend-env
    volumes: ["artifacts:/artifacts"]
    depends_on:
      backend: {condition: service_healthy}
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,time; assert time.time()-float(pathlib.Path('/artifacts/heartbeat').read_text())<15"]
      interval: 10s
      timeout: 3s
      retries: 10
  db:
    container_name: ${COMPOSE_PROJECT_NAME:-lift-lab}-db
    image: postgres:16-alpine
    environment: {POSTGRES_USER: lift, POSTGRES_PASSWORD: lift, POSTGRES_DB: lift}
    ports: ["${DB_PORT:-17700}:5432"]
    volumes: ["db-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lift -d lift"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    container_name: ${COMPOSE_PROJECT_NAME:-lift-lab}-redis
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  db-data:
  redis-data:
  artifacts:
